<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nullvault — Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-glow"></div>
    </div>

    <div class="auth-wrapper">
        <a href="index.html" class="brand fade-in stagger-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Nullvault</span>
        </a>

        <div class="glass-card auth-card fade-in stagger-2">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Access your zero-knowledge vault</p>
            </div>

            <form id="loginForm" onsubmit="event.preventDefault(); login();">
                <!-- Username field -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" class="input-field" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <!-- Master Password field -->
                <div class="form-group">
                    <label for="masterPassword">Master Password</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <circle cx="12" cy="16" r="1"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="masterPassword" class="input-field" placeholder="Enter master password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-accent" style="margin-top: 12px;" id="submitBtn">
                    <span id="btnText">Sign In</span>
                    <span id="btnLoader" class="spinner" style="display: none;"></span>
                </button>

                <!-- Alerts -->
                <div class="alert alert-danger" id="errorAlert">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" x2="12" y1="8" y2="12"/>
                        <line x1="12" x2="12.01" y1="16" y2="16"/>
                    </svg>
                    <span id="errorMsg">Invalid credentials</span>
                </div>
            </form>
        </div>

        <div class="auth-footer fade-in stagger-3">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:8080' 
            : 'https://nullvault.onrender.com';

        async function login() {
            const username = document.getElementById('username').value.trim();
            const masterPassword = document.getElementById('masterPassword').value;
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const errorAlert = document.getElementById('errorAlert');
            const submitBtn = document.getElementById('submitBtn');

            // Reset states
            errorAlert.style.display = 'none';
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';
            submitBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, masterPassword })
                });

                if (res.ok) {
                    const data = await res.json();
                    
                    // SessionStorage requirements
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('username', data.username || username);
                    sessionStorage.setItem('masterPassword', masterPassword);
                    
                    window.location.href = 'dashboard.html';
                } else {
                    const errorText = await res.text();
                    showError(errorText || 'Authentication failed. Please check your username and password.');
                }
            } catch (err) {
                console.error(err);
                showError('Could not connect to the authentication server. Please verify you are online.');
            } finally {
                btnText.style.display = 'inline-block';
                btnLoader.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        function showError(msg) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorAlert.style.display = 'flex';
        }
    </script>
</body>
</html>
