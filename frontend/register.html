<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nullvault — Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-glow"></div>
    </div>

    <div class="auth-wrapper">
        <a href="index.html" class="brand fade-in stagger-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Nullvault</span>
        </a>

        <div class="glass-card auth-card fade-in stagger-2">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Set up your zero-knowledge secure vault</p>
            </div>

            <form id="registerForm" onsubmit="event.preventDefault(); register();">
                <!-- Username field -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" class="input-field" placeholder="Choose a username" required autocomplete="username">
                    </div>
                </div>

                <!-- Email field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <input type="email" id="email" class="input-field" placeholder="Enter your email" required autocomplete="email">
                    </div>
                </div>

                <!-- Master Password field -->
                <div class="form-group">
                    <label for="masterPassword">Master Password</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                            <circle cx="12" cy="16" r="1"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="masterPassword" class="input-field" placeholder="Choose a master password" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn-accent" style="margin-top: 12px;" id="submitBtn">
                    <span id="btnText">Create Account</span>
                    <span id="btnLoader" class="spinner" style="display: none;"></span>
                </button>

                <!-- Alerts -->
                <div class="alert alert-danger" id="errorAlert">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" x2="12" y1="8" y2="12"/>
                        <line x1="12" x2="12.01" y1="16" y2="16"/>
                    </svg>
                    <span id="errorMsg">Registration failed</span>
                </div>

                <div class="alert alert-success" id="successAlert">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    <span id="successMsg">Account created! Redirecting to sign in...</span>
                </div>
            </form>
        </div>

        <div class="auth-footer fade-in stagger-3">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:8080' 
            : 'https://password-vault-production-d1e3.up.railway.app';

        async function register() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const masterPassword = document.getElementById('masterPassword').value;
            
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const submitBtn = document.getElementById('submitBtn');

            // Reset states
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline-block';
            submitBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, masterPassword })
                });

                if (res.ok) {
                    successAlert.style.display = 'flex';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    const errorText = await res.text();
                    showError(errorText || 'Failed to register account. User may already exist.');
                }
            } catch (err) {
                console.error(err);
                showError('Could not connect to registration server. Please try again.');
            } finally {
                if (successAlert.style.display !== 'flex') {
                    btnText.style.display = 'inline-block';
                    btnLoader.style.display = 'none';
                    submitBtn.disabled = false;
                }
            }
        }

        function showError(msg) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = msg;
            errorAlert.style.display = 'flex';
        }
    </script>
</body>
</html>
